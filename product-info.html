



<section class="product-info">
  <div class="product-info__header">
    
  
  <h2 class="product-info__title section-title">
    
  </h2>

    <dl class="product-info__info">
      
  <div class="product-info__info-row ">
    <dt class="visually-hidden ">
      Статус автомобиля
    </dt>
    <dd class="product-info__status product-info__status--">
      
    </dd>
  </div>

    </dl>
  </div>
  <div class="product-info__gallery swiper">
    <ul class="swiper-wrapper">
      <li class="swiper-slide">
        
<picture>
  
  
  <source type="image/webp" srcset="images/card-images/-mobile@1x.webp 1x, images/card-images/-mobile@2x.webp 2x">
  <img class="product-info__image" src="images/card-images/-mobile@1x.jpg" srcset="images/card-images/-mobile@2x.jpg 2x" width="" height="" alt="">
</picture>

      </li>
    </ul>
  </div>
  <div class="product-info__tabs" role="tablist" aria-label="Характеристики и информация о товаре">
    
  <button
    class="product-info__tab is-active"
    type="button"
    role="tab"
    aria-selected="true"
    aria-controls="specs"
    id="tab-specs"
    >
    Характеристики
  </button>

    
  <button
    class="product-info__tab "
    type="button"
    role="tab"
    aria-selected="false"
    aria-controls="additional"
    id="tab-additional"
    tabindex="-1">
    Дополнительная информация
  </button>

  </div>
  <div class="product-info__content is-active" id="specs" role="tabpanel" tabindex="0" aria-labelledby="tab-specs">
    <dl class="product-info__info">
      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      Объем двигателя
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      Год
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      Пробег
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

      
  <div class="product-info__info-row product-info__info-row--full">
    <dt class="visually-hidden ">
      Тип оформления
    </dt>
    <dd class="product-info__info-value product-info__info-value--full">
      
    </dd>
  </div>

      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      Привод
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      КПП
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

    </dl>
  </div>
  <div class="product-info__content" id="additional" role="tabpanel" tabindex="0" aria-labelledby="tab-additional" hidden>
    <dl class="product-info__info">
      
    </dl>
  </div>
  <div class="product-info__purchase">
    <dl class="product-info__price-block">
      
  <div class="product-info__info-row ">
    <dt class="product-info__info-term ">
      
    </dt>
    <dd class="product-info__info-value ">
      
    </dd>
  </div>

    </dl>
    <div class="product-info__actions">
      
  <button class="btn btn--consultation" type="button">
    Консультация бесплатно
  </button>

      
  <button class="btn btn--order" type="button">
    Оставить заявку
  </button>

    </div>
  </div>
</section>
